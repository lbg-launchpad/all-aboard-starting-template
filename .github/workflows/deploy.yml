# Builds Stride and deploys the code to the web app created by infra/deploy.sh.
# Run it from the Actions tab. Signs in to Azure with OpenID Connect: no stored password or secret.
# Set up once (see infra/README.md):
#   Secrets:   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, AZURE_RESOURCE_GROUP
#   Variable:  AZURE_WEBAPP_NAME
# Logs in a public repo are public: never print ids or secrets in a step.
name: deploy
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci && npm test
        working-directory: backend

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build front end
        run: npm ci && npm run build
        working-directory: stride
      - name: Build backend
        run: npm ci && npm run build
        working-directory: backend
      - name: Package
        run: |
          mkdir pkg
          cp -r backend/dist backend/assets backend/package.json backend/package-lock.json pkg/
          cp -r stride/dist pkg/public
          (cd pkg && npm ci --omit=dev --no-audit --no-fund && zip -qr ../stride.zip .)
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy
        run: az webapp deploy -g "${{ secrets.AZURE_RESOURCE_GROUP }}" -n "${{ vars.AZURE_WEBAPP_NAME }}" --src-path stride.zip --type zip -o none
